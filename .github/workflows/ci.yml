name: CI

# Runs on every push to main + every PR. Catches type/lint/build errors
# before they reach prod. Replaces the upstream Nextbase CI which was
# gated to the original repo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time env. Real values are loaded at runtime on the VPS via
      # /etc/juthoor/env. CI uses the same publishable key as dev — it's
      # public and safe to embed in the build.
      NEXT_PUBLIC_SUPABASE_URL: https://nlufpicjdeeqcgepewdg.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter web exec tsc --noEmit

      - name: Lint
        run: pnpm --filter web exec oxlint .
        continue-on-error: true   # demote to warning until baseline clean

      - name: Build
        run: pnpm --filter web build
